name: Scientific contracts
on:
  pull_request:
  push:
    branches: [main, release/v2.0.0]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: python -B scripts/verify_source.py
      - run: python -B -m unittest discover -s tests -t . -v
        env:
          PV2_SNAPSHOT: /nonexistent-licensed-snapshot
          PYTHONDONTWRITEBYTECODE: '1'
